# checkout-funnel-spec.yaml
# ---------------------------------------------------------------------------
# Single source of truth for the CHECKOUT SESSION funnel — the grain is one
# shopping cart. Consumed by the spine-backed skills (funnel-dropoff,
# stage-timing, segment-compare, funnel-pulse), which query the session-grain
# spine directly to compute what the SUM/SUM query-metric model structurally
# cannot: per-stage drop-off with terminal-branch attribution, and percentile
# stage timing.
#
# The governed weekly metrics (skills/query-metric/metrics/checkout/) and these
# skills describe the SAME funnel. Keep the stage ladder here consistent with
# skills/query-metric/views/checkout-views.md.
#
# Why this domain: the return window. A delivered order is not a settled order —
# the customer has ~30 days to send it back. That makes the tail of this funnel
# genuinely unresolved for recent cohorts, which is the condition under which
# naive conversion reporting is wrong and the per-stage maturity machinery below
# earns its keep. Swap the domain by replacing this file and the metric
# definitions; no engine change is required.
# ---------------------------------------------------------------------------

source_view: analytics.cart_checkout_session_spine
source_project: ${ASSAY_BIGQUERY_PROJECT}
accuracy_tier: T2

# ---------------------------------------------------------------------------
# Entity anchor. This funnel is CHECKOUT-SESSION grain. The named entity model
# lives in skills/query-metric/entities/ (one markdown file per entity); these
# blocks name the primary entity and the relationships the stage ladder
# traverses, so the agent selects from named entities and edges rather than
# inferring them from join logic. `kind` mirrors the registry's cardinality
# vocabulary.
# ---------------------------------------------------------------------------
primary_entity: checkout_session
entities:
  - checkout_session   # the stage ladder's grain — one cart
  - order              # created at confirmation; carries fulfilment + returns
  - payment            # the authorization attempt and its decision
  - shipment           # dispatch -> delivery leg
  - customer           # person rollup (secondary grain; no spine registered)
  - channel            # acquisition surface (slicing dim + cutover anchor)
  - market             # selling region (slicing dim)
relationships:
  - { from: checkout_session, to: customer, kind: many_to_one,        via: customer_token }
  - { from: checkout_session, to: payment,  kind: one_to_zero_or_one, via: checkout_session_id }
  - { from: checkout_session, to: order,    kind: one_to_zero_or_one, via: checkout_session_id }
  - { from: order,            to: shipment, kind: one_to_zero_or_one, via: order_id }
  - { from: checkout_session, to: channel,  kind: many_to_one,        via: channel }
  - { from: checkout_session, to: market,   kind: many_to_one,        via: market }
# The categoricals this ladder slices by are enumerated governed DIMENSIONS
# anchored to an entity, not standalone entities: `payment_method` (-> payment),
# `category` (-> order). See entities/README.md, "Entities vs. dimensions".

# Cohort/time + maturity controls (columns on the spine).
cohort_column: cohort_week          # DATE — ISO-Monday week the cart was created
maturity_flag: is_mature_45d        # BOOL — created_at < now - 45d.
                                    # LEGACY whole-funnel gate, reachable only via
                                    # `--maturity flag`. By default every consumer
                                    # uses the PER-STAGE `stage_maturity` table
                                    # below: each stage is gated to the cohort
                                    # weeks mature FOR THAT STAGE (via its own
                                    # `maturity_stage:`), so an early conversion
                                    # (cart -> checkout started, minutes) is not
                                    # withheld for the six weeks a return-window
                                    # outcome needs to settle.

defaults:
  lookback_weeks: 26                # default window when the question gives none
  mature_only: true                 # default to settled cohorts

# A spine may declare ONE legacy cohort that every default read excludes — a
# retired checkout version, a sunset channel. BOTH keys must be present or the
# clause is omitted entirely: `col != NULL` evaluates to NULL rather than TRUE,
# so binding a missing value would silently zero EVERY row instead of excluding
# nothing. (This replaced a single-key `legacy_flow_profile` in the private
# original, where exactly that failure was possible and invisible in output.)
# A spine with no legacy cohort simply leaves both keys out.
legacy_exclude_column: checkout_version
legacy_exclude_value: "v1-legacy"

# funnel-pulse: recent-vs-baseline regression monitor over MATURE cohorts.
# Because maturity is required for a coherent funnel, "recent" means recent
# *mature* cohorts, not last week — this is a sustained-health monitor, not a
# real-time one. Stage-aware: each stage is compared over its own mature window,
# so a cart-abandonment regression surfaces within days while the return-window
# stage stays settled.
pulse:
  by: channel               # default monitoring unit (any allowed_dimension)
  recent_weeks: 4           # recent mature cohorts
  baseline_weeks: 8         # the mature cohorts immediately before "recent"
  min_started: 200          # skip a group below this cart count in EITHER window
  flag_threshold_pp: 3.0    # flag a stage / branch share move of >= this (pp)

# Ordered funnel stages. Each is a boolean flag on the spine; stage conversion is
# COUNTIF(flag) over the segment, computed stage-to-stage and cumulative.
# `maturity_stage` keys into stage_maturity.lag_days below. `created` is the open
# anchor (lag 0 — mature as soon as the cohort week completes).
stages:
  - { ordinal: 1, key: created,                label: "Cart Created",           flag: cart_created_flag,           maturity_stage: created }
  - { ordinal: 2, key: checkout_started,       label: "Checkout Started",       flag: checkout_started_flag,       maturity_stage: checkout_started }
  - { ordinal: 3, key: payment_submitted,      label: "Payment Submitted",      flag: payment_submitted_flag,      maturity_stage: payment_submitted }
  - { ordinal: 4, key: payment_decisioned,     label: "Payment Decisioned",     flag: payment_decisioned_flag,     maturity_stage: payment_decisioned }
  # `settle_column` names the arrival timestamp for a stage no timing
  # transition arrives at, so calibrate_maturity.py can still measure its
  # settle curve. Stages covered by a transition's `to:` don't need one.
  - { ordinal: 5, key: order_confirmed,        label: "Order Confirmed",        flag: order_confirmed_flag,        maturity_stage: order_confirmed, settle_column: order_confirmed_at }
  - { ordinal: 6, key: shipped,                label: "Shipped",                flag: shipped_flag,                maturity_stage: shipped }
  - { ordinal: 7, key: delivered,              label: "Delivered",              flag: delivered_flag,              maturity_stage: delivered }
  - { ordinal: 8, key: return_window_complete, label: "Return Window Complete", flag: return_window_complete_flag, maturity_stage: return_window_complete }

# terminal_branch values in the curated deepest-first order (mirrors the CASE in
# views/cart_checkout_session_spine.sql). This is the drop-off decomposition: of
# all carts created, the share that ENDED in each branch. A value the spine emits
# that is absent here is still counted, appended under "(other)".
terminal_branches:
  - "8 Return Window Complete"
  - "7r Delivered then Returned"
  - "7 Delivered (Return Window Open)"
  - "6 Shipped (In Transit)"
  - "5x Cancelled after Confirmation"
  - "5 Confirmed not Shipped (Out of Stock)"
  - "4d Payment Declined"
  - "4f Fraud / Identity Check Failed"
  - "3r Payment Under Review (Unresolved)"
  - "3z Stale (Post-Submit)"
  - "3 Payment Submitted, Undecided"
  - "2 Checkout Started, No Payment"
  - "1z Stale (Pre-Checkout)"
  - "1 Cart Abandoned"

# Timing transitions for stage-timing. `from`/`to` are spine TIMESTAMP columns.
# Rows where either endpoint is NULL are excluded, so a transition's stats cover
# the population that actually reached both points. `maturity_stage` is the
# transition's ARRIVAL stage: gating to cohorts mature for the endpoint stops
# recent cohorts — whose slow members have not yet arrived — from biasing the
# percentiles downward (survivorship).
transitions:
  - { key: cart_to_checkout_start,   label: "Cart -> Checkout Start",      from: cart_created_at,       to: checkout_started_at,       unit: minute, maturity_stage: checkout_started }
  - { key: checkout_to_payment,      label: "Checkout Start -> Payment",   from: checkout_started_at,   to: payment_submitted_at,      unit: minute, maturity_stage: payment_submitted }
  - { key: payment_to_decision,      label: "Payment -> Decision",        from: payment_submitted_at,  to: payment_decisioned_at,     unit: minute, maturity_stage: payment_decisioned }
  - { key: confirm_to_ship,          label: "Confirmation -> Ship",       from: order_confirmed_at,    to: shipped_at,                unit: minute, maturity_stage: shipped }
  - { key: ship_to_deliver,          label: "Ship -> Deliver",            from: shipped_at,            to: delivered_at,              unit: day,    maturity_stage: delivered }
  - { key: deliver_to_window_end,    label: "Deliver -> Return Window End", from: delivered_at,        to: return_window_ends_at,     unit: day,    maturity_stage: return_window_complete }

# Governance allow-lists (R2 / R3). Group-by dimensions and filter columns;
# anything outside these refuses cleanly. `cohort_week` is the window control,
# not a generic equality filter, so it is absent from allowed_dimensions.
allowed_dimensions:
  - channel
  - payment_method
  - market
  - category
  - checkout_version
  - is_first_order
  - terminal_branch

allowed_filters:
  - channel
  - payment_method
  - market
  - category
  - checkout_version
  - is_first_order

# Columns that are not STRING on the spine and must be CAST(... AS STRING) when
# grouped or filtered (the helper binds filter values as STRING). Emitted as
# canonical BigQuery; `_shared/dialect.py` rewrites STRING -> TEXT for sqlite.
string_cast:
  - is_first_order

# >>> stage_maturity >>>
# Per-stage maturity lags in days, keyed by a stage's `maturity_stage`. A cohort
# week is mature for a stage only once its WHOLE week (open .. open+6d) is older
# than that stage's lag.
#
# ---------------------------------------------------------------------------
# THESE NUMBERS ARE ILLUSTRATIVE, NOT CALIBRATED.
# ---------------------------------------------------------------------------
# In a real deployment this block is GENERATED by measuring open-anchored settle
# time on the spine (the p95 of DATE_DIFF(stage_date, created_date, DAY)) and
# rewriting the file. The entire value of the machinery is that the lags were
# *measured* — a hand-picked lag is an assumption wearing a measurement's
# clothes. The values below are hand-authored to be plausible for a ~30-day
# return window so the mechanism has something coherent to act on in a template;
# they describe no real business, and `calibrated_at: null` plus
# `illustrative: true` say so in machine-readable form.
# tests/test_maturity.py asserts those two flags stay set, so this file cannot
# quietly start implying it was measured.
stage_maturity:
  illustrative: true
  basis: hand_authored_illustrative     # a real one reads: open_anchored_days
  percentile: null                      # a real one records the percentile used
  calibrated_at: null                   # a real one records the calibration date
  calibration_window: null
  lag_days:
    created: 0                    # the open anchor: mature when the week completes
    checkout_started: 0           # same session, minutes later
    payment_submitted: 1          # a saved cart can be returned to next day
    payment_decisioned: 2         # instant card auth is seconds; review is days
    order_confirmed: 3            # confirmation follows an approved payment
    shipped: 7                    # warehouse pick/pack, incl. weekend spillover
    delivered: 14                 # carrier transit, incl. slow markets
    return_window_complete: 44    # delivered (14) + the ~30-day return window
    # Terminal-branch stages, gated like the ladder stages so the branch mix is
    # read over cohorts settled for the branch in question.
    payment_declined: 2           # settles with the decision
    fraud_fail: 3                 # manual review adds a day over a decline
    payment_review_unresolved: 12 # matches the bank-transfer override below
    cancelled: 10                 # post-confirmation cancellations cluster early
    returned: 44                  # a return is only knowable once the window closes
    stale_pre_checkout: 30        # definitional: the abandonment flag fires at 30d
    stale_post_submit: 30         # same abandonment rule, post-submit
  # Per-group overrides. `payment_decisioned` is dominated book-wide by instant
  # card authorization (~82% of volume), so a single lag is far too short for the
  # methods that route to a human or to a bank clearing cycle. A group only earns
  # an override when its own lag is materially longer than the default; anything
  # without an entry keeps the book-wide value, so this is purely additive.
  # Consumers (funnel-pulse) apply these when grouping BY the same dimension.
  lag_days_overrides:
    payment_decisioned:
      by: payment_method
      values:
        bank_transfer_review: 12  # clearing cycle plus manual review queue
        wallet: 3                 # provider callback, usually same-day
# <<< stage_maturity <<<

# ---------------------------------------------------------------------------
# Latency KPIs — NAMED percentile KPIs served by the stage-timing engine, not by
# query-metric (whose contract is SUM/SUM and structurally cannot express a
# percentile). Each is a thin alias over a `transitions` entry above, pinning the
# headline percentiles, tier, and owner so it is citable by name.
# ---------------------------------------------------------------------------
kpis:
  - key: time_to_ship_days
    display_name: "Time to ship (Confirmation -> Ship, days)"
    transition: confirm_to_ship
    report_unit: day                   # transition unit is minute; render p* / 1440
    percentiles: [50, 90, 99]
    accuracy_tier: T2
    maturity_stage: shipped
    owner: analytics-owner
    leak_guarded: "Confirmed not Shipped (Out of Stock) — the controllable leak"
    smes: [analytics-owner, fulfilment-pm]
  - key: time_to_decision_minutes
    display_name: "Time to payment decision (Submit -> Decision, minutes)"
    transition: payment_to_decision
    report_unit: minute
    percentiles: [50, 90, 99]
    accuracy_tier: T2
    maturity_stage: payment_decisioned
    owner: analytics-owner
    leak_guarded: "Payment Under Review (Unresolved) — the slow manual path"
    smes: [analytics-owner, payments-pm]

# ---------------------------------------------------------------------------
# funnel-nowcast: chain-ladder projection of an immature cohort's ultimate.
#
# This block was deliberately absent through Phase 4, on the argument that
# now-cast parameters are judgment calls against a real book and authoring
# them here would fit the fixture generator. That argument was right about the
# design it applied to — a hand-authored development curve — and dissolves for
# the design that shipped instead: Mack's distribution-free chain ladder
# ESTIMATES every development factor and variance from the triangle at run
# time (Mack 1993; the same estimator is the epidemiological nowcasting
# community's baseline). Nothing below is a fitted business parameter. These
# are estimation controls: which stages have a tail worth projecting, how far
# the triangle develops, and the floors that keep a thin cohort from wearing a
# confident band. On fixtures the output is watermarked and its factors
# describe the generator — same standing as every other skill's fixture
# numbers. `--backtest` reports empirical interval coverage next to nominal,
# which is the check that keeps a plausible-looking band honest.
nowcast:
  # Only stages with a genuine maturation tail. Fast-settling stages are
  # refused as targets: their governed actuals exist within days, and a
  # forecast of a knowable number is a downgrade wearing a confidence band.
  stages:
    - delivered
    - return_window_complete
  default_stage: return_window_complete
  # Development horizon in whole weeks. Absent per-stage values derive from
  # stage_maturity.lag_days (ceil((lag+1)/7)), so the horizon tracks the
  # calibrated settle curve rather than being authored twice.
  development_weeks: null
  # Trailing cohorts used to estimate factors (null = all available). The
  # standard trailing-diagonals defense against an old regime leaking into
  # current factors; tighten it after a known cutover.
  factor_window_cohorts: null
  quantiles: [10, 50, 90]
  # A cohort below this many carts is skipped rather than now-cast: a chain
  # ladder on a thin cohort produces a band with nothing inside it.
  min_cohort_size: 200

# ---------------------------------------------------------------------------
# Deliberately absent: `scorecard:`.
#
# release-scorecard's parameters — BSTS priors, control-series selection,
# minimum pre/post windows — remain judgment calls against a real book's
# observed behavior, and unlike the nowcast's development factors they cannot
# be estimated from the triangle alone: a causal verdict computed over
# generated data measures the generator's parameters, not a release. The
# registry (config/modules.yaml) marks release-scorecard excluded with this
# reason, and tests/test_module_registry.py enforces that an included skill
# has the spec keys it needs — so the absence is checked, not just documented.
# ---------------------------------------------------------------------------
