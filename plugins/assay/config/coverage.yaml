# coverage.yaml
# ---------------------------------------------------------------------------
# The instrumentation coverage register: the stakeholder-facing answer to
# "can I measure X yet?"
#
# The metric catalog says what you CAN ask. This says what you cannot ask yet,
# why, and who owns the blocker — so the question stops routing through an
# analyst who then answers it from memory. It is the consumable form of the
# instrumentation-gap backlog an analytics team already keeps somewhere less
# useful.
#
# Read by `assay:coverage` (the human-facing skill), by
# `assay:load-context coverage` / `coverage/{id}` (the machine form), and linted
# by tests/test_coverage.py. Never a gate on anything: a missing or unparseable
# register yields an empty result rather than an error, because advisory metadata
# that can break a query is worse than no metadata.
#
# status enum (mirrored in `_shared/coverage.py`):
#   live        queryable now. Point at a registered metric, a spine skill, or
#               the exploratory lane.
#   partial     queryable, but with a known coverage hole — the number is a
#               subset or a lower bound. Name the hole so it is not read as
#               complete.
#   empty       schema is wired but zero rows in production. Name the gap and
#               the thing to watch.
#   blocked     not instrumented. Carries the blocker and its owner.
#   declined    product or engineering declined the instrumentation. Recorded so
#               the ask stops recurring every quarter.
#   flag_gated  visible only behind a feature flag or a dated launch.
#
# Required per entry: `id`, `asks`, `status`. Anything not `live` must also carry
# `blocker`. `asks` is the human-curated field — it is what a stakeholder's
# phrasing matches against, so keep it natural-language and generous.
#
# OWNERS ARE ROLE PLACEHOLDERS, NOT PEOPLE. A public template has no business
# carrying names; a real register names a person, because "who owns this" is the
# whole point of the field. Ticket keys are fictional.
# ---------------------------------------------------------------------------

coverage:
  # --- live ---------------------------------------------------------------
  - id: checkout_funnel_conversion
    asks:
      - "checkout funnel"
      - "cart to checkout conversion"
      - "payment approval rate"
      - "order confirmation rate"
      - "where do carts drop off"
      - "cart abandonment rate"
      - "return window complete rate"
    status: live
    fields: [cart_created_flag, checkout_started_flag, payment_submitted_flag, payment_decisioned_flag, order_confirmed_flag, shipped_flag, delivered_flag, return_window_complete_flag]
    streams: [analytics.cart_checkout_funnel_weekly, analytics.cart_checkout_session_spine]
    serve: >-
      Live as governed T2 metrics — see `assay:catalog` for the fifteen
      registered ratios (cart_to_checkout_start_conversion,
      payment_approval_rate, delivered_to_return_window_complete_rate, and so
      on). For stage-by-stage leak attribution rather than a single ratio, use
      `assay:funnel-dropoff`, which adds the terminal-branch decomposition the
      SUM/SUM metric model cannot express.
    owner: analytics-owner
    verified: 2026-08-17

  - id: stage_timing
    asks:
      - "how long does a stage take"
      - "time from payment to decision"
      - "time to ship"
      - "stage latency"
      - "p50 p90 p99 in the funnel"
      - "delivery time"
    status: live
    fields: [cart_created_at, checkout_started_at, payment_submitted_at, payment_decisioned_at, order_confirmed_at, shipped_at, delivered_at, return_window_ends_at]
    streams: [analytics.cart_checkout_session_spine]
    serve: >-
      Live via `assay:stage-timing` (p50/p90/p99 plus mean and n per stage
      transition). Two transitions are pinned as named KPIs in the funnel spec's
      `kpis:` block — `time_to_ship_days` and `time_to_decision_minutes` — so
      they are citable by name rather than reconstructed per request.
    owner: analytics-owner
    verified: 2026-08-17

  # --- partial ------------------------------------------------------------
  - id: return_reason_codes
    asks:
      - "why do customers return"
      - "return reason"
      - "return reason code"
      - "wrong size returns"
      - "damaged on arrival"
      - "return driver breakdown"
    status: partial
    fields: [return_reason_code]
    streams: [analytics.cart_checkout_session_spine]
    blocker: >-
      A reason code is captured only when the customer starts the return in the
      self-service portal (~31% of returns). Returns opened through support, and
      every silent carrier-initiated return, land with the field NULL. Any
      reason-code split is therefore a portal-user subset, not the return
      population, and it skews toward the segments that self-serve. Use it to
      rank drivers WITHIN the portal cohort; do not present it as the reason mix
      for all returns. Widening it needs the support tool to write the same
      enum — owner: support-platform, tracked as FUL-208.
    blocker_ref: FUL-208
    owner: fulfilment-eng
    verified: 2026-08-17

  - id: delivery_carrier_scan_events
    asks:
      - "carrier scan events"
      - "where is the parcel"
      - "in transit detail"
      - "delivery exception"
      - "failed delivery attempt"
      - "last mile detail"
    status: partial
    fields: [scan_event_type, scan_occurred_at]
    streams: [raw_carrier_feed.scan_events]
    blocker: >-
      Scan-level events exist but only for the two carriers that cover ~72% of
      shipments; the remaining regional carriers report a single delivered
      confirmation and nothing between. The spine's `delivered_at` is complete
      for every shipment — it is the intermediate detail that is partial. So
      ship-to-deliver TIMING is safe book-wide, and any question about *where* a
      slow shipment stalled is answerable for less than three quarters of it.
      Note also the 2026-06-01 provider switch in guardrails.yaml.
    owner: fulfilment-eng
    verified: 2026-08-17

  # --- empty (schema wired, nothing in production) ------------------------
  - id: payment_retry_attempts
    asks:
      - "payment retry"
      - "how many times did they retry the card"
      - "retry after decline"
      - "second payment attempt"
      - "declined then approved"
    status: empty
    fields: [attempt_ordinal, retry_of_payment_id]
    streams: [raw_payments.authorization_attempts]
    blocker: >-
      The columns are wired and populate in staging, but production has written
      zero rows since the feed was enabled: the gateway integration emits the
      retry linkage only on the newer API version, which the checkout has not
      moved to. So a declined-then-approved cart currently looks like two
      unrelated payments and the approval rate double-counts its denominator by a
      small, unmeasured amount. Watch CHK-451 (gateway API upgrade) — the queries
      are written and banked against it, so this is blocked on the ship, not on
      analysis.
    blocker_ref: CHK-451
    owner: payments-eng
    verified: 2026-08-17

  # --- blocked ------------------------------------------------------------
  - id: cart_abandon_reason
    asks:
      - "why was the cart abandoned"
      - "abandonment reason"
      - "did they leave because of shipping cost"
      - "exit reason"
      - "abandon survey"
      - "what made them drop out"
    status: blocked
    fields: [abandon_reason, exit_intent_event]
    streams: []
    blocker: >-
      Not instrumented, and it is the single most requested thing in this
      register. The funnel can say a cart stopped at checkout-started and never
      submitted a payment; it cannot say why, because no exit-intent event, no
      abandonment survey, and no shipping-cost-shown event is emitted anywhere.
      Beware the plausible-looking substitute: `terminal_branch = '2 Checkout
      Started, No Payment'` is the SHAPE of abandonment, not a reason for it, and
      reporting it as one is how a stalled payment form gets read as price
      sensitivity. Needs a client-side event from web-platform (CHK-377) before
      any of it is measurable.
    blocker_ref: CHK-377
    owner: web-platform
    verified: 2026-08-17

  - id: browse_to_cart_handoff
    asks:
      - "browse to cart conversion"
      - "how many sessions create a cart"
      - "product page to cart"
      - "browse session funnel"
      - "add to cart rate"
      - "catalog engagement"
    status: blocked
    fields: [browse_session_id, checkout_session_id]
    streams: []
    blocker: >-
      Browse-session grain is not provisioned in the warehouse, so the `browse`
      module registers a spine and a declarative handoff edge to
      `checkout/session` on `checkout_session_id` but no queryable view behind
      it. This is the entry to read before trusting that edge's `coverage:`
      value, which is a DESIGN-TIME ESTIMATE and is labelled as one in
      config/modules.yaml. Its denominator is the honest difficulty: a browse
      session that never produces a cart has no `checkout_session_id` at all, so
      the coverage of the edge is the browse-to-cart CONVERSION RATE, measured
      over all browse sessions — not a join-completeness or data-quality figure,
      and not something the checkout spine can compute, because a session that
      produced no cart is not on it. Needs the browse event stream landed and
      sessionized (PLAT-112) before the number can be measured rather than
      asserted.
    blocker_ref: PLAT-112
    owner: data-platform
    verified: 2026-08-17

  - id: promo_code_attribution
    asks:
      - "promo code"
      - "discount code impact"
      - "did the coupon drive the order"
      - "promotion attribution"
      - "voucher redemption"
    status: blocked
    fields: [promo_code, discount_amount]
    streams: [raw_pricing.cart_adjustments]
    blocker: >-
      The redeemed code is on the order, but the code the shopper was EXPOSED to
      is not recorded anywhere, so there is no denominator: redemptions over
      redemptions is 100% by construction. Incrementality is unanswerable until
      exposure is logged. Owner growth-pm has the ask (CHK-402); the field is
      genuinely absent rather than sparse, so there is no partial read available
      in the meantime.
    blocker_ref: CHK-402
    owner: growth-pm
    verified: 2026-08-17

  # --- declined -----------------------------------------------------------
  - id: on_site_search_terms
    asks:
      - "site search terms"
      - "what do people search for"
      - "zero result searches"
      - "search to purchase"
      - "internal search analytics"
    status: declined
    fields: [search_term]
    streams: []
    blocker: >-
      Declined by web-platform and the privacy reviewer, not deferred: raw search
      strings are free-text a shopper typed and are treated as potentially
      identifying, so they are not landed in the warehouse at all. The vendor
      search console keeps aggregate term reports and that is the sanctioned
      route. Recorded here so the ask stops re-routing to analytics once a
      quarter — the answer is not "not yet", it is "not here".
    owner: web-platform
    verified: 2026-08-17

  # --- flag_gated ---------------------------------------------------------
  - id: wallet_provider_breakdown
    asks:
      - "which wallet provider"
      - "wallet provider split"
      - "wallet approval by provider"
      - "one click wallet performance"
    status: flag_gated
    fields: [wallet_provider]
    streams: [analytics.cart_checkout_session_spine]
    blocker: >-
      `payment_method='wallet'` is a rollup of three providers, and the
      provider-level column populates only behind the multi-wallet flag, live in
      `market='uk'` only. So a provider split is available for roughly a tenth of
      wallet volume and is not representative of the rest. Gated on the wider
      rollout (CHK-488, no date). Until then, read `payment_method` at the rollup
      level and expect its blended approval rate to move when the mix does.
    blocker_ref: CHK-488
    owner: payments-eng
    verified: 2026-08-17
