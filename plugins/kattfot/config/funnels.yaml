# Funnel definitions for visualize-metric's funnel mode.
#
# Each entry names an ORDERED list of registered stage metrics. The skill runs
# query-metric once per stage over a shared time range and filter set, then
# composes the stage conversion rates into a single funnel chart. The product of
# the stage rates approximates the module's end-to-end metric — and when it does
# not, that gap is itself the finding, which is why `end_to_end` is named here
# rather than left implicit.
#
# Stage metric names must match the `name:` in the metric definitions (consumer
# dir first, then the plugin-bundled query-metric catalog).
#
# Resolution order (first match wins): `config/funnels.yaml` in the consumer
# repo, then `$KATTFOT_FUNNELS_CONFIG`, then this plugin-bundled default.

checkout:
  title: Checkout funnel — Cart Created to Return Window Complete
  # End-to-end reference metric (product of the stages below ~ this).
  end_to_end: cart_to_return_window_complete_end_to_end
  stages:
    - cart_to_checkout_start_conversion        # Cart Created      -> Checkout Started
    - checkout_start_to_payment_submit_rate    # Checkout Started  -> Payment Submitted
    - payment_submit_to_decision_rate          # Payment Submitted -> Payment Decisioned
    - payment_approval_rate                    # Decisioned        -> Approved
    - approved_to_order_confirmed_rate         # Approved          -> Order Confirmed
    - order_confirmed_to_shipped_rate          # Order Confirmed   -> Shipped
    - shipped_to_delivered_rate                # Shipped           -> Delivered
    - delivered_to_return_window_complete_rate # Delivered         -> Window Complete
  # Per-segment funnels need no separate key: every stage metric above accepts
  # channel / payment_method / market / category filters, so
  #   /visualize-metric show the checkout funnel for the mobile_app channel
  # draws a single-channel funnel through the same entry.

# A deliberately short second funnel: the payment leg only. Useful for showing
# that a funnel is a named composition of governed metrics rather than a
# hard-coded pipeline, and for the common case where the question is about the
# authorization step and the fulfilment tail is noise.
checkout-payment:
  title: Payment leg — Checkout Started to Order Confirmed
  end_to_end: cart_to_order_confirmed_end_to_end
  stages:
    - checkout_start_to_payment_submit_rate
    - payment_submit_to_decision_rate
    - payment_approval_rate
    - approved_to_order_confirmed_rate
